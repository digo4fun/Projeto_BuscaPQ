<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaPQ - Busca de Profissionais LinkedIn</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">
                <i class="fas fa-search"></i>
                BuscaPQ
            </h1>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="showSearchPage()">
                        <i class="fas fa-search"></i>
                        Buscar Profissionais
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="showStoredPage()">
                        <i class="fas fa-users"></i>
                        Perfis Salvos
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <!-- Página de Busca -->
        <div id="search-page" class="page active">
            <div class="container">
                <h2 class="page-title">
                    <i class="fas fa-search"></i>
                    Buscar Profissionais no LinkedIn
                </h2>
                
                <form id="search-form" class="search-form">
                    <div class="form-group">
                        <label for="skills">
                            <i class="fas fa-code"></i>
                            Palavras-chave das Skills:
                        </label>
                        <input type="text" id="skills" name="skills" required 
                               placeholder="Ex: Java, Spring Boot, React, Python">
                    </div>
                    
                    <div class="form-group">
                        <label for="experience">
                            <i class="fas fa-calendar-alt"></i>
                            Anos de Experiência:
                        </label>
                        <input type="number" id="experience" name="experience" min="0" max="50" required
                               placeholder="Ex: 5">
                    </div>
                    
                    <div class="form-group">
                        <label for="location">
                            <i class="fas fa-map-marker-alt"></i>
                            Localização (Cidade, Estado):
                        </label>
                        <input type="text" id="location" name="location" required
                               placeholder="Ex: São Paulo, SP">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i>
                        Buscar Profissionais
                    </button>
                </form>
                
                <div id="loading" class="loading hidden">
                    <i class="fas fa-spinner fa-spin"></i>
                    Buscando profissionais...
                </div>
                
                <div id="search-results" class="search-results hidden">
                    <h3 class="results-title">
                        <i class="fas fa-users"></i>
                        Resultados da Busca
                    </h3>
                    <div id="results-container" class="results-container">
                        <!-- Resultados serão inseridos aqui -->
                    </div>
                    <div class="results-actions">
                        <button id="save-selected" class="btn btn-success" onclick="saveSelectedProfiles()">
                            <i class="fas fa-save"></i>
                            Salvar Selecionados
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Página de Perfis Salvos -->
        <div id="stored-page" class="page">
            <div class="container">
                <h2 class="page-title">
                    <i class="fas fa-users"></i>
                    Perfis Salvos para Entrevistas
                </h2>
                
                <div id="stored-loading" class="loading hidden">
                    <i class="fas fa-spinner fa-spin"></i>
                    Carregando perfis salvos...
                </div>
                
                <div id="stored-results" class="stored-results">
                    <div id="stored-container" class="stored-container">
                        <!-- Perfis salvos serão inseridos aqui -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 BuscaPQ - Sistema de Busca de Profissionais LinkedIn</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
